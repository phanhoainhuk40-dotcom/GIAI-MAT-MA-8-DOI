    // --- SYNTHETIC AUDIO ENGINE (Web Audio API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playBeep(freq = 440, duration = 0.1, type = 'sine') {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }

      playCorrect() {
        if (this.muted) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => this.playBeep(freq, 0.15, 'triangle'), idx * 80);
        });
      }

      playWrong() {
        if (this.muted) return;
        this.init();
        this.playBeep(220, 0.2, 'sawtooth');
        setTimeout(() => this.playBeep(180, 0.3, 'sawtooth'), 150);
      }

      playUnlock() {
        if (this.muted) return;
        this.init();
        [400, 600, 800, 1200].forEach((f, i) => {
          setTimeout(() => this.playBeep(f, 0.08, 'sine'), i * 50);
        });
      }

      playTick() {
        if (this.muted) return;
        this.playBeep(800, 0.03, 'square');
      }

      playVictory() {
        if (this.muted) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playBeep(freq, 0.25, 'triangle'), idx * 160);
        });
      }
    }

    const getRandomCode = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    // MAIN APP COMPONENT
    function App() {
      // Automatic detection: Host by default, Player if URL has ?room=
      const [role, setRole] = React.useState(() => {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('room') ? 'player' : 'host';
      });

      const [roomExists, setRoomExists] = React.useState(false);
      const roomRef = React.useMemo(() => realtimeDB.ref('rooms/' + roomCode), [roomCode]);
      const isHost = role === 'host';

      React.useEffect(() => {
        firebaseAuth.signInAnonymously().then(() => {
          setFirebaseReady(true);
          setConnectionStatus('Đã kết nối Firebase');
        }).catch(err => setConnectionStatus('Lỗi xác thực: ' + err.message));
      }, []);

      // Custom Host Base URL for QR generation (fixes 'Server not found' on local/iframe preview)
      const [customBaseUrl, setCustomBaseUrl] = React.useState(() => {
        return window.location.origin + window.location.pathname;
      });
      const [manualRoomInput, setManualRoomInput] = React.useState('');

      const [selectedTeamId, setSelectedTeamId] = React.useState(1);

      const [questionsList, setQuestionsList] = React.useState(() => {
        try {
          const saved = localStorage.getItem('ak_game_questions');
          return saved ? JSON.parse(saved) : INITIAL_QUESTIONS;
        } catch (e) {
          return INITIAL_QUESTIONS;
        }
      });

      // Player Gameplay states
      const [shuffledQuestions, setShuffledQuestions] = React.useState([]);
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [selectedOption, setSelectedOption] = React.useState(null);
      const [answered, setAnswered] = React.useState(false);
      const [timeLeft, setTimeLeft] = React.useState(30);

      // Teams Data
      const [teams, setTeams] = React.useState(() => {
        try {
          const saved = localStorage.getItem('ak_game_teams');
          return saved ? JSON.parse(saved) : DEFAULT_TEAMS;
        } catch (e) {
          return DEFAULT_TEAMS;
        }
      });

      const [gameStatus, setGameStatus] = React.useState('lobby'); // 'lobby', 'playing', 'finished'
      const [revealSecret, setRevealSecret] = React.useState(false);
      const [soundMuted, setSoundMuted] = React.useState(false);
      const [showImageManager, setShowImageManager] = React.useState(false);

      // Modal state for Host viewing/answering a specific puzzle box question
      const [activeQuestion, setActiveQuestion] = React.useState(null);
      const [modalAnswered, setModalAnswered] = React.useState(false);
      const [modalSelectedOpt, setModalSelectedOpt] = React.useState(null);

      // Listen to shared room data on every device.
      React.useEffect(() => {
        if (!firebaseReady) return;
        const listener = snapshot => {
          const data = snapshot.val();
          setRoomExists(!!data);
          if (data) {
            if (data.teams) setTeams(Object.values(data.teams).sort((a,b) => a.id-b.id));
            if (data.questions) {
              const q = Object.values(data.questions).sort((a,b) => a.id-b.id);
              setRemoteQuestions(q);
              setQuestionsList(prev => JSON.stringify(prev) === JSON.stringify(q) ? prev : q);
            }
            // Each student's start state is local; do not reset it on every database update.
            if (typeof data.revealSecret === 'boolean') setRevealSecret(data.revealSecret);
          } else if (isHost) {
            roomRef.set({
              teams: Object.fromEntries(DEFAULT_TEAMS.map(t => [t.id, t])),
              questions: Object.fromEntries(questionsList.map(q => [q.id, q])),
              status: 'lobby', revealSecret: false,
              createdAt: firebase.database.ServerValue.TIMESTAMP
            }).catch(err => setConnectionStatus('Không thể tạo phòng: ' + err.message));
          }
        };
        roomRef.on('value', listener, err => setConnectionStatus('Lỗi đọc dữ liệu: ' + err.message));
        return () => roomRef.off('value', listener);
      }, [roomRef, firebaseReady, isHost]);

      // Save states to localStorage
      React.useEffect(() => {
        try {
          localStorage.setItem('ak_game_questions', JSON.stringify(questionsList));
        } catch (e) {}
      }, [questionsList]);

      React.useEffect(() => {
        try {
          localStorage.setItem('ak_game_teams', JSON.stringify(teams));
        } catch (e) {}
      }, [teams]);

      // Timer Effect for Player
      React.useEffect(() => {
        let timer = null;
        if (role === 'player' && gameStatus === 'playing' && !answered && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleTimeOut();
                return 0;
              }
              if (prev <= 5) soundFX.playTick();
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [role, gameStatus, answered, timeLeft]);

      const prepareQuestions = () => {
        return questionsList.map(q => {
          const optionsObj = q.options.map((opt, idx) => ({
            text: opt,
            isCorrect: idx === q.correctIndex
          }));
          return {
            ...q,
            shuffledOptions: [...optionsObj].sort(() => Math.random() - 0.5)
          };
        });
      };

      // Initialize player questions on mount or role change
      React.useEffect(() => {
        setShuffledQuestions(prepareQuestions());
      }, [questionsList]);

      // Image Upload Handlers
      const handleFileUpload = (qId, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          roomRef.child('questions/' + qId + '/customImgUrl').set(reader.result).catch(err => alert('Ảnh quá lớn hoặc lỗi Firebase: ' + err.message));
        };
        reader.readAsDataURL(file);
      };

      const handleUrlChange = (qId, url) => {
        roomRef.child('questions/' + qId + '/customImgUrl').set(url);
      };

      const handleClearImage = (qId) => {
        roomRef.child('questions/' + qId + '/customImgUrl').set('');
      };

      const handleRenameTeam = (id, newName) => {
        if (!firebaseReady) return;
        roomRef.child('teams/' + id + '/name').set(newName);

                </div>

                <h2 className="text-xl font-black text-military-gold uppercase tracking-wider mb-1">
                  CHIẾN BINH GIẢI MẬT MÃ
                </h2>
                
                {/* Manual Room Code Entry for Students */}
                <div className="bg-military-800 border border-military-gold/30 rounded-xl p-3 mb-4 text-left shadow-lg">
                  <label className="block text-[11px] font-bold text-military-gold mb-1 uppercase">
                    MÃ PHÒNG HIỆN TẠI: <span className="font-mono text-white ml-1">{roomCode}</span>
                  </label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Nhập mã phòng khác..." 
                      value={manualRoomInput}
                      onChange={(e) => setManualRoomInput(e.target.value.toUpperCase())}
                      className="w-full px-2.5 py-1.5 bg-military-900 border border-military-gold/40 rounded-lg text-xs font-mono text-military-gold uppercase focus:outline-none"
                    />
                    <button 
                      onClick={() => {
                        if (manualRoomInput.trim()) {
                          setRoomCode(manualRoomInput.trim());
                          setManualRoomInput('');
                        }
                      }}
                      className="px-3 py-1.5 bg-military-gold text-military-900 font-bold text-xs rounded-lg whitespace-nowrap hover:bg-yellow-400"
                    >
                      Kết nối
                    </button>
                  </div>
                </div>

                <div className="text-xs mb-3 text-military-gold">● {connectionStatus} {roomExists ? '· Phòng đã sẵn sàng' : '· Chưa tìm thấy phòng'}</div>
                {/* Team Selection Options */}
                <div className="bg-military-800 border border-military-gold/30 rounded-xl p-4 mb-5 text-left shadow-lg">
                  <label className="block text-xs font-bold text-military-gold mb-2 uppercase">
                    CHỌN ĐỘI THI ĐẤU CỦA BẠN:
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    {teams.map((t) => (
                      <button
                        key={t.id}
                        onClick={() => setSelectedTeamId(t.id)}
                        className={`p-2.5 rounded-lg border text-xs font-bold flex items-center gap-2 transition ${
                          selectedTeamId === t.id 
                            ? 'bg-military-gold text-military-900 border-military-gold shadow-md' 
                            : 'bg-military-900/60 text-military-cream border-military-gold/20'
                        }`}
                      >
                        <i className={`fa-solid ${t.icon}`}></i>
                        <span className="truncate">{t.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={handleStartPlayerGame}
                  disabled={!firebaseReady || !roomExists}
                  className="w-full py-3.5 bg-gradient-to-r from-military-gold to-yellow-400 text-military-900 font-extrabold rounded-xl shadow-lg uppercase tracking-wider text-sm hover:scale-105 transition transform"
                >
                  BẮT ĐẦU VÀO THI ĐẤU 🚀
                </button>
              </div>
            </div>
          );
        }

        // Student Playing View
        if (currentQ && currentQIndex < shuffledQuestions.length) {
          return (
            <div className="min-h-screen bg-military-900 p-4 flex flex-col justify-between max-w-md mx-auto">
              <div>
                {/* Team Status Header */}
                <div className="flex items-center justify-between mb-3 bg-military-800 p-3 rounded-xl border border-military-gold/30 shadow">
                  <div className="flex items-center gap-2">
                    <i className={`fa-solid ${playerTeam.icon} text-military-gold`}></i>
                    <span className="text-xs font-bold text-military-gold">{playerTeam.name}</span>
                  </div>
                  <div className="text-xs font-mono text-military-cream">
                    Điểm: <span className="text-military-gold font-bold">{playerTeam.score || 0}</span>
                  </div>
                </div>

                {/* Timer & Progress */}
                <div className="flex items-center justify-between text-xs font-mono text-military-gold/80 mb-2">
                  <span>CÂU {currentQIndex + 1}/8</span>
                  <span className={`font-bold text-sm ${timeLeft <= 5 ? 'text-red-400 animate-pulse' : 'text-military-gold'}`}>
                    ⏱️ {timeLeft}s
                  </span>
                </div>

                <div className="w-full bg-military-800 h-2 rounded-full overflow-hidden mb-4 border border-military-gold/20">
                  <div 
                    className="bg-military-gold h-full transition-all duration-300" 
                    style={{ width: `${((currentQIndex + 1) / 8) * 100}%` }}
                  ></div>
                </div>

                {/* Question Image and Content */}
                <div className="bg-military-800 border border-military-gold/30 rounded-2xl p-4 mb-4 shadow-lg">
                  <div className="mb-3">
                    <AKPartSVG type={currentQ.svgType} customImgUrl={currentQ.customImgUrl} />
                  </div>
                  <h3 className="text-sm font-bold text-military-cream leading-relaxed">
                    {currentQ.question}
                  </h3>
                </div>

                {/* Option Buttons */}
                <div className="space-y-2 mb-4">
                  {currentQ.shuffledOptions.map((option, idx) => {
                    let style = "bg-military-800 border-military-gold/30 text-military-cream";
                    if (answered) {
                      if (option.isCorrect) {
                        style = "bg-emerald-600 border-emerald-400 text-white font-bold";
                      } else if (selectedOption === option) {
                        style = "bg-rose-600 border-rose-400 text-white";
                      } else {
                        style = "bg-military-800/40 border-transparent text-military-cream/40";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        disabled={answered}
                        onClick={() => {
                          setSelectedOption(option);
                          submitAnswer(option);
                        }}
                        className={`w-full p-3 rounded-xl border text-left text-xs font-semibold transition flex items-center justify-between ${style}`}
                      >
                        <span>{String.fromCharCode(65 + idx)}. {option.text}</span>
                        {answered && option.isCorrect && (
                          <i className="fa-solid fa-circle-check text-white"></i>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Next Question Navigation */}
              {answered && (
                <div className="mt-2">
                  <button
                    onClick={() => {
                      if (currentQIndex + 1 < shuffledQuestions.length) {
                        setCurrentQIndex(prev => prev + 1);
                        setAnswered(false);
                        setSelectedOption(null);
                        setTimeLeft(30);
                      } else {
                        setGameStatus('finished');
                      }
                    }}
                    className="w-full py-3 bg-military-gold text-military-900 font-bold rounded-xl text-xs uppercase tracking-wider shadow-lg hover:bg-yellow-400 transition"
                  >
                    {currentQIndex + 1 < shuffledQuestions.length ? "CÂU TIẾP THEO ➔" : "XEM KẾT QUẢ HIỆN TẠI"}
                  </button>
                </div>
              )}
            </div>
          );
        }

        // Student Finished View
        return (
          <div className="min-h-screen bg-military-900 p-4 flex flex-col justify-between items-center text-center max-w-md mx-auto">
            <div className="w-full my-auto">
              <div className="w-20 h-20 bg-military-gold/20 border-2 border-military-gold rounded-full flex items-center justify-center text-military-gold text-3xl mx-auto mb-4 animate-bounce">
                <i className="fa-solid fa-trophy"></i>
              </div>

              <h2 className="text-2xl font-black text-military-gold uppercase tracking-wider mb-1">
                HOÀN THÀNH NHIỆM VỤ!
              </h2>
              <p className="text-xs text-military-cream/70 mb-5">{playerTeam.name}</p>

              <div className="bg-military-800 border border-military-gold/30 rounded-2xl p-6 mb-6 shadow-xl">
                <div className="text-xs text-military-cream/60 mb-1 uppercase">TỔNG ĐIỂM ĐẠT ĐƯỢC</div>
                <div className="text-4xl font-mono font-black text-military-gold mb-4">
                  {playerTeam.score || 0}
                </div>

                <div className="border-t border-military-gold/20 pt-4 text-left">
                  <div className="text-xs font-bold text-military-gold mb-2 uppercase">TỪ KHÓA ĐÃ GIẢI MÃ:</div>
                  <div className="flex flex-wrap gap-1.5">
                    {(playerTeam.unlockedWords || []).map((w, i) => (
                      <span key={i} className="px-2.5 py-1 bg-military-900 border border-military-gold/40 text-military-gold font-bold text-xs rounded-md">
                        {w}
                      </span>
                    ))}
                    {(playerTeam.unlockedWords || []).length === 0 && (
                      <span className="text-xs text-military-cream/40 italic">Chưa mở được từ khóa nào</span>
                    )}
                  </div>
                </div>
              </div>

              <button
                onClick={() => {
                  setGameStatus('lobby');
                  setCurrentQIndex(0);
                  setAnswered(false);
                }}
                className="w-full py-3 bg-military-700 border border-military-gold/40 text-military-gold font-bold rounded-xl text-xs uppercase tracking-wider hover:bg-military-600 transition"
              >
                THI ĐẤU LẠI
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    // Render App Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
